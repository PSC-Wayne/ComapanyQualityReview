name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  t01-golden-path:
    name: T01 golden path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit and contract suite
        run: python -m pytest -q tests/contracts tests/golden_path
      - name: Primary golden path seam
        run: python -m pytest -q tests/golden_path
      - name: Bind golden path output to actual PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          from company_quality.runtime import GoldenPathQuery, run_golden_path

          result = run_golden_path(
              GoldenPathQuery("2330", "TWSE", "2026-07-23T06:30:00Z"),
              producer_candidate_sha=os.environ["HEAD_SHA"],
          )
          assert result.error_code is None
          assert result.producer_candidate_sha == os.environ["HEAD_SHA"]
          assert result.snapshot is not None and result.report is not None
          assert result.snapshot.producer_candidate_sha == result.report.producer_candidate_sha
          PY
      - name: Build exact PR admission manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          authority = {
              "spec_sha": "docs/specs/company-quality-product-spec.md",
              "decision_map_sha": "docs/planning/company-quality-decision-map.md",
              "delivery_plan_sha": "docs/planning/company-quality-multi-agent-delivery-plan.md",
              "work_order_sha": "docs/work-orders/r9/01-golden-path.md",
          }
          manifest = {
              "assignment_id": "95adf90d-6f4b-4b32-a3e7-7fcf2e7ca3f0",
              "active_binding_generation": 1,
              "eligibility_generation": 2,
              "ticket_id": "T01",
              "ticket_generation": "R9",
              "authorization": "GO-T01",
              "issued_at": now.isoformat(),
              "lease_expires_at": (now + timedelta(hours=1)).isoformat(),
              "review_deadline_at": (now + timedelta(hours=1)).isoformat(),
              "repository": "PSC-Wayne/ComapanyQualityReview",
              "parent_sha": os.environ["BASE_SHA"],
              "branch": "DETACHED",
              "worktree": os.getcwd(),
              "owned_paths": [
                  "pyproject.toml",
                  "src/company_quality/runtime/",
                  "src/company_quality/report_shell/",
                  "tests/golden_path/",
                  "tests/contracts/",
                  ".github/workflows/ci.yml",
                  "tools/admission_scan.py",
                  "tools/validate_json.py",
                  "docs/governance/calibration-freeze/schemas/",
              ],
              "ticket_set_digest": "f3f2167aff87623caf74c44135b852384035e8cf276ddd46221506c9995859fb",
              "network_allowed": False,
              "product_scope": "T01_ONLY",
              "stop_after_ticket": True,
          }
          for field, path in authority.items():
              manifest[field] = hashlib.sha256(Path(path).read_bytes()).hexdigest()
          output = Path(os.environ["RUNNER_TEMP"]) / "t01-admission-manifest.json"
          output.write_text(json.dumps(manifest), encoding="utf-8")
          PY
      - name: Scan actual PR candidate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python tools/admission_scan.py
          --candidate "$HEAD_SHA"
          --forbid-secrets
          --forbid-unowned
          --manifest "$RUNNER_TEMP/t01-admission-manifest.json"
      - name: Compile mutation-free runtime
        run: python -m compileall -q src tools
