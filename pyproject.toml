[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-quality"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.10,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pandas>=2,<3", "pyarrow>=15,<24"]
real-data = [
  "finlab>=2,<3", "opencc-python-reimplemented>=0.1.7,<1",
  "pandas>=2,<3", "pyarrow>=15,<24", "pymupdf>=1.24,<2",
  "pypdf>=5,<7", "rapidocr-onnxruntime>=1.4,<2", "requests>=2,<3"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/company_quality"]
