[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-quality"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.10,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/company_quality"]
